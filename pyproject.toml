[project]
name = "tokres"
version = "0.1.0"
description = "Tokenization policy research agent: monitor, evaluate, index, and query tokenization news from Korean and global institutions"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "httpx>=0.27",
    "feedparser>=6.0",
    "selectolax>=0.3",
    "trafilatura>=2.0",
    "pypdf>=5.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "anthropic>=0.69",
    "qdrant-client[fastembed]>=1.12",
    "kiwipiepy>=0.20",
    "jinja2>=3.1",
    "voyageai>=0.3",
    "mcp>=1.10",
    "python-dateutil>=2.9",
    "googlenewsdecoder>=0.1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.35", "ruff>=0.7"]

[project.scripts]
tokres = "tokres.cli:app"
tokres-mcp = "tokres.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokres"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that hit real endpoints"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
