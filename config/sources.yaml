- name: bis_press
  entity: BIS
  region: GLOBAL
  tier: T0
  type: rss
  url: https://www.bis.org/doclist/all_pressrels.rss
  poll: twice_daily

- name: bis_mgmt_speeches
  entity: BIS
  region: GLOBAL
  tier: T0
  type: rss
  url: https://www.bis.org/doclist/mgmtspeeches.rss
  poll: daily

- name: bis_innovation_hub
  entity: BIS
  region: GLOBAL
  tier: T0
  type: html_list
  url: https://www.bis.org/about/innovation-hub/news?page={page}
  base_url: https://www.bis.org
  item: "div.card-wrapper"
  link: "a.card-link"
  title: ".card-heading"
  date: ".card-date"
  date_format: "%d %b %Y"
  require_date: true
  page_start: 0
  poll: daily
  backfill:
    stop_on_date_before_from: true
    max_pages: 10

- name: sec_press
  entity: SEC
  region: US
  tier: T0
  type: rss
  url: https://www.sec.gov/news/pressreleases.rss
