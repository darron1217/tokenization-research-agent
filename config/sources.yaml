- name: sec_speeches_statements
  entity: SEC
  region: US
  tier: T0
  type: rss
  url: https://www.sec.gov/news/speeches-statements.rss
  poll: daily

- name: fsb_press
  entity: FSB
  region: GLOBAL
  tier: T0
  type: rss
  url: https://www.fsb.org/feed/
  poll: daily

- name: iosco_media
  entity: IOSCO
  region: GLOBAL
  tier: T0
  type: html_list
  url: https://www.iosco.org/media_room/?subsection=media_releases&year={year}&page={page}
  base_url: https://www.iosco.org
  item: "li:has(a[href*='IOSCONEWS'])"
  link: "a[href*='IOSCONEWS']"
  title: "self"
  title_strip: "\\b\\d{1,2} [A-Z][a-z]{2} 20\\d\\d\\b|View Release"
  date: "self"
  date_format: null
  poll: daily
  backfill:
    by_year: true
    max_pages: 20

