- name: hkma_press
  entity: HKMA
  region: HK
  tier: T0
  type: json_api
  url: https://api.hkma.gov.hk/public/press-releases?lang=en&pagesize=50&offset={offset}
  records_path: result.records
  fields: {title: title, link: link, date: date}
  date_format: "%Y-%m-%d"
  poll: daily
  backfill:
    offset_step: 50
    max_pages: 200

# ---------------- Global: T1 ----------------
- name: iif_press
  entity: IIF
  region: GLOBAL
  tier: T1
  type: html_list
  url: https://www.iif.com/About-Us/Press/lapg-1641/{page}
  base_url: https://www.iif.com
  item: "div.article"
  link: "h4.article--title a"
  title: "h4.article--title a"
  date: "span.article--date"
  date_format: "%B %d, %Y"
  poll: daily
  backfill:
    stop_on_date_before_from: true
    max_pages: 60

