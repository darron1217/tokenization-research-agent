  tier: T0
  type: rss
  url: https://www.bok.or.kr/portal/bbs/B0000552/news.rss?menuNo=200690
  poll: twice_daily

- name: bok_payment
  entity: 한국은행
  region: KR
  tier: T0
  type: rss
  url: https://www.bok.or.kr/portal/bbs/B0000507/news.rss?menuNo=201225
  poll: daily

- name: bok_issue_note
  entity: 한국은행
  region: KR
  tier: T0
  type: rss
  url: https://www.bok.or.kr/portal/bbs/P0002353/news.rss?menuNo=200433
  poll: daily

- name: bok_governor_speech
  entity: 한국은행
  region: KR
  tier: T0
  type: rss
  url: https://www.bok.or.kr/portal/bbs/P0002575/news.rss?menuNo=200041
  poll: daily

# ---------------- Korea: discovery (T2/T3 via domains.yaml) ----------------
- name: naver_news
  entity: null
  region: KR
  tier: T2
  type: naver_news
  queries_from: topics.discovery_queries_ko
  poll: daily

# NOTE (2026-09): Google News RSS article links are opaque redirects that can no longer be resolved without a browser,
# so these are disabled by default. Naver (KR) and GDELT (KR/EN) give direct publisher URLs instead.
- name: google_news_kr
  enabled: false
  entity: null
  region: KR
  tier: T2
  type: google_news
  hl: ko
  gl: KR
  ceid: "KR:ko"
  queries_from: topics.discovery_queries_ko
  poll: daily

- name: google_news_en
  enabled: false
  entity: null
  region: GLOBAL
  tier: T2
  type: google_news
  hl: en-US
  gl: US
  ceid: "US:en"
  queries_from: topics.discovery_queries_en
  poll: daily

- name: gdelt_en
  entity: null
  region: GLOBAL
  tier: T2
  type: gdelt
  queries_from: topics.gdelt_queries_en
  poll: daily

- name: gdelt_kr
  entity: null
  region: KR
  tier: T2
  type: gdelt
  sourcelang: korean
  queries_from: topics.gdelt_queries_ko
  poll: daily

