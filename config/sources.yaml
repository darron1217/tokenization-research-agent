# Source registry. Each entry becomes a SourceAdapter instance.
# tier: T0 regulator/policy primary · T1 market infra/institution official · T2 major press · T3 analysis/opinion · T4 unverified social
# type: rss | html_list | json_api | naver_news | google_news | bird_x
# poll: daily | twice_daily
# backfill: optional pagination spec for html_list/json_api, or archive_url for RSS-only sources

# ---------------- Korea: T0 ----------------
- name: fsc_press
  entity: 금융위원회
  region: KR
  tier: T0
  type: rss
  url: http://www.fsc.go.kr/about/fsc_bbs_rss/?fid=0111
  poll: twice_daily
  backfill:
    type: html_list
    url: https://www.fsc.go.kr/no010101?curPage={page}&srchBeginDt={from}&srchEndDt={to}
    date_format: "%Y-%m-%d"
    item: "div.board-list-wrap ul li"
    link: "div.subject a"
    title: "div.subject a"
    date: "div.day"
    stop_on_date_before_from: true
    max_pages: 400

- name: fsc_press_explain
  entity: 금융위원회
  region: KR
  tier: T0
  type: rss
  url: http://www.fsc.go.kr/about/fsc_bbs_rss/?fid=0112
  poll: daily

- name: fss_press
  entity: 금융감독원
  region: KR
  tier: T0
  type: html_list
  url: https://www.fss.or.kr/fss/bbs/B0000188/list.do?menuNo=200218&pageIndex={page}
  base_url: https://www.fss.or.kr
  item: "table tbody tr"
  link: "td.title a, td.subject a, a"
  title: "td.title a, td.subject a, a"
  date: "td.date, td:nth-last-child(1)"
  date_format: "%Y-%m-%d"
  poll: daily
  backfill:
    stop_on_date_before_from: true
    max_pages: 2500

