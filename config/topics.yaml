  - 토큰화 한국은행
  - 예탁결제원 토큰
  - 예탁결제원 분산원장
  - 스테이블코인 규제
  - 원화 스테이블코인
  - CBDC 한국은행
  - 프로젝트 한강
  - 분산원장 결제
  - RWA 토큰화
  - 조각투자 제도화
