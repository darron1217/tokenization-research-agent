  tokenized_deposits:     {ko: 예금토큰, en: tokenized deposits}
  stablecoin:             {ko: 스테이블코인, en: stablecoins}
  cbdc:                   {ko: CBDC, en: central bank digital currency}
  tokenized_funds_rwa:    {ko: 토큰화 펀드·RWA, en: tokenized funds / real-world assets}
