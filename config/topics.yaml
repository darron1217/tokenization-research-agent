  - tokenized deposits
  - tokenized securities
  - tokenization BIS
  - '"Project Agora" BIS'
  - unified ledger
  - tokenized fund
  - tokenized treasury
  - DTCC tokenization
  - SEC tokenization
  - SEC tokenized securities
  - Kinexys JPMorgan
  - IIF digital assets
  - FSB tokenisation
  - IOSCO tokenisation
  - Euroclear tokenization
  - Clearstream D7
  - SWIFT tokenized
  - HKMA tokenisation
  - MAS Project Guardian
  - ECB DLT settlement
# GDELT queries: keep short (≥5s per call). Boolean OR groups reduce call count.
gdelt_queries_en:
  - '"tokenized deposits" OR "tokenised deposits"'
  - '"tokenized securities" OR "tokenised securities" OR "security token"'
  - '"tokenization" AND (BIS OR SEC OR DTCC OR "Financial Stability Board" OR IOSCO)'
  - '"tokenized fund" OR "tokenized treasury" OR "tokenized money market"'
  - '"Project Agora" OR "unified ledger" OR Kinexys'
gdelt_queries_ko:
  - '토큰증권 OR 예금토큰 OR 조각투자'
  - '토큰화 AND (금융위 OR 한국은행 OR 예탁결제원)'
  - '스테이블코인 AND (금융위 OR 한국은행)'
x_queries:
  - tokenized deposits
  - tokenization BIS
  - "Project Agora"
  - 토큰증권
  - 예금토큰
